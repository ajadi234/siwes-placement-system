databases:
  - name: siwes-db
    plan: free

services:
  - type: web
    name: siwes-connect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siwes-db
          property: connectionString
