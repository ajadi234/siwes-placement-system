<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SIWES Placement System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            SIWES<span>Connect</span>
        </div>

        <div class="nav-links">

            <a href="{{ url_for('auth.register') }}">
                Register
            </a>

        </div>

    </nav>


    <section class="profile-page"
              style="max-width: 480px;">

        <div class="profile-header">

            <h1>Login</h1>

            <p>
                Welcome back. Enter your details to continue.
            </p>

        </div>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="success-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST"
              class="profile-form">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-button">

                Login

            </button>

        </form>


        <p style="text-align: center; margin-top: 20px;">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Register
            </a>

        </p>

    </section>

</body>

</html>
