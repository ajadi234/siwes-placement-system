<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - SIWES Placement System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            SIWES<span>Connect</span>
        </div>

        <div class="nav-links">

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>

        </div>

    </nav>


    <section class="profile-page"
              style="max-width: 480px;">

        <div class="profile-header">

            <h1>Create Account</h1>

            <p>
                Join SIWESConnect to find or post placements.
            </p>

        </div>


        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="success-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


        <form method="POST"
              class="profile-form">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Full Name</label>

            <input
                type="text"
                name="full_name"
                placeholder="Enter your full name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <label>Account Type</label>

            <select name="role" required>

                <option value="">
                    Select account type
                </option>

                <option value="student">
                    Student
                </option>

                <option value="company">
                    Company
                </option>

            </select>


            <button
                type="submit"
                class="primary-button">

                Create Account

            </button>

        </form>


        <p style="text-align: center; margin-top: 20px;">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">
                Login
            </a>
        </p>

    </section>

</body>

</html>
